<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="container">
        <h1 class="app-title">Rock Paper Scissors</h1>
        <div class="weapon-box">
            <h3>Select your Weapon</h3>
            <div class="weapons">
                <div class="Rock">
                    <img src="images/rock.png" alt="">
                </div>
                <div class="Paper">
                    <img src="images/paper.png" alt="">
                </div>
                <div class="Scissors">
                    <img src="images/scissors.png" alt="">
                </div>
            </div>

        </div>
        <div class="player-choices">
            <h3>Player <span>v/s</span> Computer</h3>
            <div class="player-choice">
                <img src="images/rock.png" alt="">
            </div>
            <div class="computer-choice">
                <img src="images/rock.png" alt="">
            </div>   
        </div>
        
        <div class="result-box">
            <h3>Congrats, You Won! &#x1F389;</h3>
            <button class="Play-again">&#x21BB; Play Again</button>
        </div>
        
        <div class="score-box">
            <div class="won">
                <h3>Won: <span>0</span></h3>
            </div>
            <div class="lost">
                <h3>Lost: <span>0</span></h3>
            </div>
            <div class="Draw">
                <h3>Draw: <span>0</span></h3>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
